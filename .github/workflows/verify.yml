name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Bound each test package so a regression fails instead of stalling CI.
env:
  GOFLAGS: -timeout=2m

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify
        run: make verify

      - name: Race tests
        run: make test-race

  native-filesystem:
    name: Native filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Includes Windows literal-path/native Shell and owned-helper regressions.
      - name: Native filesystem and desktop boundary tests
        run: go test ./internal/config ./internal/directdl ./internal/download
