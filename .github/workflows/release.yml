name: Release
run-name: Release ${{ inputs.channel }} (${{ inputs.bump }} bump)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [rc, stable]
        default: stable

# Serialize calculation as well as publication across all dispatch refs/channels.
# GitHub may replace an older pending run; this is not a FIFO queue.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Calculate next version
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          new_version="$(bash scripts/release-version.sh "$BUMP" "$CHANNEL")"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          printf 'Next version: %s (%s, %s bump)\n' "$new_version" "$CHANNEL" "$BUMP"

          {
            printf '## 🚀 Release Version\n\n'
            printf '| Field | Value |\n'
            printf '|-------|-------|\n'
            printf '| Channel | `%s` |\n' "$CHANNEL"
            printf '| Bump type | `%s` |\n' "$BUMP"
            printf '| **New version** | **`%s`** |\n' "$new_version"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build release assets
    runs-on: ubuntu-24.04
    needs: prepare
    environment: release
    env:
      NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
      CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify
        run: make verify VERSION="${NEW_VERSION}"

      - name: Race tests
        run: make test-race

      - name: Build release binaries
        run: make clean build-all VERSION="${NEW_VERSION}"

      - name: Verify embedded version
        run: |
          version_output="$(./bin/rdtui-linux-amd64 --version)"
          expected="rdtui ${NEW_VERSION}"
          if [ "$version_output" != "$expected" ]; then
            printf 'expected %s, got %s\n' "$expected" "$version_output"
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd bin
          sha256sum rdtui-* > checksums.txt

      - name: Sign checksums
        run: |
          cosign sign-blob \
            --yes \
            --bundle bin/checksums.txt.sigstore.json \
            bin/checksums.txt

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          git push origin "${NEW_VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${NEW_VERSION}" >/dev/null 2>&1; then
            gh release upload "${NEW_VERSION}" \
              bin/rdtui-* \
              bin/checksums.txt \
              bin/checksums.txt.sigstore.json \
              --clobber
          else
            release_flags=(--latest)
            if [ "$CHANNEL" = rc ]; then
              release_flags=(--prerelease --latest=false)
            fi
            gh release create "${NEW_VERSION}" \
              bin/rdtui-* \
              bin/checksums.txt \
              bin/checksums.txt.sigstore.json \
              --verify-tag \
              "${release_flags[@]}" \
              --title "${NEW_VERSION}" \
              --notes "Release ${NEW_VERSION}"
          fi
